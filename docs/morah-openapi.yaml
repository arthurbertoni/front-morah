openapi: 3.2.0
info:
  title: Morah API — Gestão Condominial
  version: "2.0.0"
  license:
    name: Proprietary
  description: |
    API do Sistema Morah (backend Spring Boot) cobrindo os módulos desta entrega:
    Login, Tela Inicial, Financeiro, Portaria, Avisos, Reservas de Áreas Comuns,
    Minha Unidade, Encomendas, Notificações e Personalização do Condomínio.

    ## Autenticação (JWT + Spring Security)
    - `POST /auth/login` recebe e-mail e senha e devolve um **access token JWT**
      (HS256, assinado pelo próprio backend) e um **refresh token** opaco.
    - As demais chamadas enviam `Authorization: Bearer <accessToken>`.
    - O access token carrega as claims `sub` (id da pessoa), `sid` (id da sessão),
      `perfil`, `condominio_id` e `unidade_id` (ausente para síndico e portaria).
    - Toda sessão tem um contexto ativo (condomínio + perfil). No login o servidor
      escolhe o primeiro vínculo da pessoa; `POST /auth/contexto` troca o contexto.
    - `POST /auth/logout` encerra a sessão: a partir daí o access token e o refresh
      token deixam de ser aceitos (`401`).
    - Nenhum endpoint recebe o `condominioId`/`unidadeId` do próprio usuário por
      parâmetro: eles vêm sempre do token.

    ## Perfis (RBAC)
    Perfis: `morador`, `proprietario`, `sindico`, `portaria`. Em cada operação, a lista
    em `security: bearerAuth: [...]` indica os perfis aceitos (papéis, OpenAPI 3.1+).
    `proprietario` é cumulativo a `morador`: tem tudo o que o morador tem, mais as
    operações exclusivas de proprietário. Perfil fora da lista → `403`.

    Escopo dos dados:
    - morador/proprietário acessando recurso de outra unidade → `403`;
    - qualquer recurso de outro condomínio → `404`.

    ## Módulos ativáveis
    O síndico pode desativar os módulos `financeiro`, `portaria`, `avisos`, `reservas`,
    `minha_unidade` e `encomendas` do seu condomínio (`/condominio/modulos`). Com o
    módulo desativado, todas as rotas dele respondem `403` para qualquer perfil
    (inclusive síndico) e a tela inicial devolve as seções desse módulo vazias.
    Login, Tela Inicial, Notificações e Personalização não podem ser desativados.
    O webhook de pagamentos não é bloqueado (é chamado pelo gateway, não pelo app).

    ## Erros
    Formato RFC 9457 (`application/problem+json`), schema `Problem`. Erros de
    validação trazem a lista `erros`.

    ## Paginação
    Listas paginadas aceitam `page` (a partir de 0) e `size` (1 a 100, padrão 20) e
    devolvem `{ content, page }`. Ordenação não é suportada.
tags:
  - name: Login
    description: Login com e-mail e senha, sessão JWT e contexto ativo (condomínio/perfil).
  - name: Tela Inicial
    description: Painel inicial agregando os principais dados do perfil ativo.
  - name: Financeiro
    description: Cobranças, PIX, documentos financeiros, taxas e inadimplência.
  - name: Portaria
    description: Autorização e registro de entrada e saída de visitantes.
  - name: Avisos
    description: Mural de comunicados do condomínio.
  - name: Reservas
    description: Reserva e vistoria de áreas comuns.
  - name: Minha Unidade
    description: Dados da unidade, vínculos e gestão de inquilinos.
  - name: Encomendas
    description: Recebimento, autorização de retirada por terceiros e baixa de encomendas.
  - name: Notificações
    description: Notificações internas geradas pelos demais módulos.
  - name: Personalização
    description: Identidade visual do condomínio e ativação/desativação de módulos pelo síndico.
servers:
  - url: http://localhost:8080/v1
    description: Ambiente local de desenvolvimento
  - url: https://api.morah.com.br/v1
    description: Produção
  - url: https://api-staging.morah.com.br/v1
    description: Staging
security:
  - bearerAuth: []
paths:
  # ---------------------------------------------------------------- Login
  /auth/login:
    post:
      tags: [Login]
      summary: Autenticar com e-mail e senha
      description: |
        Valida as credenciais (senha guardada com BCrypt), cria uma sessão e devolve o
        par de tokens. O contexto inicial é o primeiro vínculo da pessoa; a lista
        `perfisDisponiveis` permite ao app oferecer a troca via `POST /auth/contexto`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              sindico:
                summary: Síndica
                value: { email: helena.prado@demo.com.br, senha: demo123 }
              proprietario:
                summary: Proprietário — Bloco A · Apto 302
                value: { email: rafael.nunes@demo.com.br, senha: demo123 }
              morador:
                summary: Moradora — Bloco B · Apto 502
                value: { email: camila.duarte@demo.com.br, senha: demo123 }
              portaria:
                summary: Portaria
                value: { email: portaria@demo.com.br, senha: demo123 }
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401":
          description: E-mail ou senha inválidos
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/me:
    get:
      tags: [Login]
      summary: Consultar a pessoa autenticada, seus perfis e o contexto ativo
      operationId: getMe
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Dados da pessoa autenticada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /auth/contexto:
    post:
      tags: [Login]
      summary: Selecionar o par condomínio/perfil ativo da sessão
      description: |
        Necessário quando a pessoa possui mais de um vínculo. Encerra a sessão atual e
        devolve um novo par de tokens com as claims do contexto escolhido.
      operationId: selecionarContexto
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextoRequest" }
      responses:
        "200":
          description: Contexto selecionado com sucesso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextoAtivoResponse" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: A pessoa não possui o vínculo (condomínio, perfil) solicitado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/refresh:
    post:
      tags: [Login]
      summary: Renovar o access token a partir de um refresh token válido
      description: O refresh token usado é invalidado e um novo par é emitido (rotação), mantendo o contexto.
      operationId: renovarToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Novo par de tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextoAtivoResponse" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /auth/logout:
    post:
      tags: [Login]
      summary: Encerrar a sessão (invalida access token e refresh token)
      operationId: logout
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "204":
          description: Sessão encerrada
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  # ---------------------------------------------------------------- Tela Inicial
  /home/dashboard:
    get:
      tags: [Tela Inicial]
      summary: Obter os dados agregados da tela inicial do perfil ativo
      description: |
        O formato varia conforme o perfil ativo (discriminador `perfil`). Listas de
        "recentes"/"próximos" trazem no máximo 5 itens. Seções de módulos desativados
        vêm vazias (`[]`, `0` ou ausentes).
      operationId: getDashboard
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Dados da tela inicial
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DashboardMorador"
                  - $ref: "#/components/schemas/DashboardSindico"
                  - $ref: "#/components/schemas/DashboardPortaria"
                discriminator:
                  propertyName: perfil
                  mapping:
                    morador: "#/components/schemas/DashboardMorador"
                    proprietario: "#/components/schemas/DashboardMorador"
                    sindico: "#/components/schemas/DashboardSindico"
                    portaria: "#/components/schemas/DashboardPortaria"
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  # ---------------------------------------------------------------- Financeiro
  /financeiro/cobrancas:
    get:
      tags: [Financeiro]
      summary: Listar cobranças da unidade ativa ou do condomínio (síndico)
      description: |
        Morador/proprietário recebem só as cobranças da própria unidade (o parâmetro
        `unidadeId` é ignorado). Síndico recebe as de todo o condomínio e pode filtrar
        por `unidadeId`. Uma cobrança `pendente` com vencimento anterior a hoje é
        devolvida como `atrasado` (calculado na leitura).
      operationId: listarCobrancas
      security:
        - bearerAuth: [morador, proprietario, sindico]
      parameters:
        - $ref: "#/components/parameters/StatusCobranca"
        - $ref: "#/components/parameters/Competencia"
        - name: unidadeId
          in: query
          description: Somente para síndico — filtra por unidade específica do condomínio.
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de cobranças
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CobrancaPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /financeiro/cobrancas/{cobrancaId}:
    parameters:
      - $ref: "#/components/parameters/CobrancaId"
    get:
      tags: [Financeiro]
      summary: Detalhar uma cobrança
      description: Morador/proprietário só podem ler cobrança da própria unidade (`403` caso contrário).
      operationId: getCobranca
      security:
        - bearerAuth: [morador, proprietario, sindico]
      responses:
        "200":
          description: Detalhe da cobrança
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cobranca" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /financeiro/cobrancas/{cobrancaId}/pix:
    parameters:
      - $ref: "#/components/parameters/CobrancaId"
    get:
      tags: [Financeiro]
      summary: Gerar/obter o código PIX copia-e-cola da cobrança
      description: Gateway simulado. O código expira 30 minutos após ser gerado.
      operationId: getPixCobranca
      security:
        - bearerAuth: [morador, proprietario]
      responses:
        "200":
          description: Código PIX
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PixResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Cobrança já está paga ou cancelada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /financeiro/cobrancas/{cobrancaId}/baixa-manual:
    parameters:
      - $ref: "#/components/parameters/CobrancaId"
    post:
      tags: [Financeiro]
      summary: Registrar baixa manual de um pagamento recebido fora do gateway
      operationId: baixarCobrancaManualmente
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaixaManualRequest" }
      responses:
        "200":
          description: Cobrança atualizada para "pago"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cobranca" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Cobrança já está paga ou cancelada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /financeiro/webhooks/pagamentos:
    post:
      tags: [Financeiro]
      summary: Webhook do gateway de pagamento (confirmação de PIX)
      description: |
        Chamado pelo gateway, não pelo app. Autenticado pela assinatura HMAC-SHA256
        (hexadecimal) do corpo bruto no cabeçalho `X-Webhook-Signature`, não por JWT.
        `confirmado` marca a cobrança como `pago` e notifica a unidade; `falhou` não
        altera nada.
      operationId: receberWebhookPagamento
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PagamentoWebhookPayload" }
      responses:
        "202":
          description: Notificação aceita
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401":
          description: Assinatura ausente ou inválida
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /financeiro/documentos:
    get:
      tags: [Financeiro]
      summary: Listar documentos financeiros publicados (notas fiscais, prestação de contas)
      operationId: listarDocumentosFinanceiros
      security:
        - bearerAuth: [morador, proprietario, sindico]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoFinanceiroPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
    post:
      tags: [Financeiro]
      summary: Publicar um novo documento financeiro
      operationId: publicarDocumentoFinanceiro
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentoFinanceiroCreateRequest" }
      responses:
        "201":
          description: Documento publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoFinanceiro" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /financeiro/taxas:
    post:
      tags: [Financeiro]
      summary: Cadastrar uma taxa/rateio para o condomínio
      operationId: criarTaxa
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxaCreateRequest" }
      responses:
        "201":
          description: Taxa criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Taxa" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /financeiro/taxas/{taxaId}/gerar-cobrancas:
    parameters:
      - $ref: "#/components/parameters/TaxaId"
    post:
      tags: [Financeiro]
      summary: Gerar cobranças em lote para todas as unidades a partir de uma taxa
      description: |
        Uma cobrança `pendente` por unidade do condomínio. `igualitario`: valor da taxa
        dividido pelo número de unidades. `fracao_ideal`: valor da taxa multiplicado pela
        fração ideal da unidade. Multa e juros nascem zerados e o vencimento é o dia
        `vencimentoDia` da competência. Unidades que não puderem ser cobradas (sem fração
        ideal no rateio por fração, ou já cobradas por esta taxa) vão para `falhas`.
        Os moradores de cada unidade cobrada são notificados.
      operationId: gerarCobrancasEmLote
      security:
        - bearerAuth: [sindico]
      responses:
        "202":
          description: Lote de cobranças processado (com relatório de falhas por unidade)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GerarCobrancasResponse" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /financeiro/inadimplencia:
    get:
      tags: [Financeiro]
      summary: Obter o resumo de inadimplência do condomínio
      description: |
        Unidade inadimplente = possui ao menos uma cobrança `atrasado`.
        `valorTotalEmAberto` = soma das cobranças `pendente` e `atrasado`.
      operationId: getResumoInadimplencia
      security:
        - bearerAuth: [sindico]
      responses:
        "200":
          description: Resumo de inadimplência
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InadimplenciaResumo" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  # ---------------------------------------------------------------- Portaria
  /portaria/visitantes:
    post:
      tags: [Portaria]
      summary: Registrar um visitante e solicitar autorização de entrada ao morador
      description: |
        Cria o visitante e uma autorização `pendente`, e notifica os moradores da
        unidade. Sem resposta em 30 minutos, a autorização passa a `expirada`
        (calculado na leitura).
      operationId: registrarVisitante
      security:
        - bearerAuth: [portaria]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutorizacaoVisitaCreateRequest" }
      responses:
        "201":
          description: Autorização criada e notificação enviada ao morador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutorizacaoVisita" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /portaria/autorizacoes:
    get:
      tags: [Portaria]
      summary: Listar autorizações de visita (fila da guarita ou pendências do morador)
      description: Portaria vê as do condomínio; morador/proprietário só as da própria unidade.
      operationId: listarAutorizacoes
      security:
        - bearerAuth: [portaria, morador, proprietario]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StatusAutorizacaoVisita" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de autorizações
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutorizacaoVisitaPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /portaria/autorizacoes/{autorizacaoId}:
    parameters:
      - $ref: "#/components/parameters/AutorizacaoId"
    get:
      tags: [Portaria]
      summary: Detalhar uma autorização de visita
      operationId: getAutorizacao
      security:
        - bearerAuth: [portaria, morador, proprietario]
      responses:
        "200":
          description: Detalhe da autorização
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutorizacaoVisita" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /portaria/autorizacoes/{autorizacaoId}/decisao:
    parameters:
      - $ref: "#/components/parameters/AutorizacaoId"
    patch:
      tags: [Portaria]
      summary: Autorizar ou recusar a entrada de um visitante
      description: Somente morador/proprietário da unidade da autorização.
      operationId: decidirAutorizacao
      security:
        - bearerAuth: [morador, proprietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisaoAutorizacaoRequest" }
      responses:
        "200":
          description: Decisão registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutorizacaoVisita" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Autorização já expirada ou já decidida
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portaria/autorizacoes/{autorizacaoId}/reenviar:
    parameters:
      - $ref: "#/components/parameters/AutorizacaoId"
    post:
      tags: [Portaria]
      summary: Reenviar a notificação de autorização pendente
      operationId: reenviarAutorizacao
      security:
        - bearerAuth: [portaria]
      responses:
        "202":
          description: Notificação reenviada
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: A autorização não está mais pendente
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /portaria/acessos:
    get:
      tags: [Portaria]
      summary: Consultar o histórico de acessos do condomínio
      operationId: listarAcessos
      security:
        - bearerAuth: [portaria, sindico]
      parameters:
        - name: data
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de acessos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcessoPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
    post:
      tags: [Portaria]
      summary: Registrar a entrada ou saída efetiva de um visitante
      description: |
        `entrada` cria um acesso com `entrada` = agora e status `no_condominio`.
        `saida` fecha o último acesso aberto do visitante (`saida` = agora, status `saiu`).
      operationId: registrarAcesso
      security:
        - bearerAuth: [portaria]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcessoCreateRequest" }
      responses:
        "201":
          description: Acesso registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Acesso" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Autorização informada não está `autorizada`, ou saída sem entrada aberta
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------- Avisos
  /avisos:
    get:
      tags: [Avisos]
      summary: Listar avisos vigentes visíveis ao contexto ativo
      description: |
        Vigente = `expiraEm` nulo ou futuro. Público `condominio`: todos; `bloco`:
        moradores do bloco; `unidade`: moradores da unidade. Síndico e portaria veem todos.
      operationId: listarAvisos
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      parameters:
        - name: categoria
          in: query
          schema: { type: string, example: manutencao }
        - name: prioridade
          in: query
          schema: { $ref: "#/components/schemas/PrioridadeAviso" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de avisos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvisoPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
    post:
      tags: [Avisos]
      summary: Publicar um novo aviso
      description: "`autor` e `publicadoEm` são preenchidos pelo servidor. O público-alvo é notificado."
      operationId: criarAviso
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvisoCreateRequest" }
      responses:
        "201":
          description: Aviso publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aviso" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /avisos/{avisoId}:
    parameters:
      - $ref: "#/components/parameters/AvisoId"
    get:
      tags: [Avisos]
      summary: Detalhar um aviso (marca como lido para a pessoa autenticada)
      operationId: getAviso
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Detalhe do aviso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aviso" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "410":
          description: Aviso fora de vigência
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      tags: [Avisos]
      summary: Editar um aviso existente (somente os campos enviados)
      operationId: atualizarAviso
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvisoUpdateRequest" }
      responses:
        "200":
          description: Aviso atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aviso" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    delete:
      tags: [Avisos]
      summary: Remover/expirar um aviso
      description: O aviso não é apagado; `expiraEm` passa a ser o instante atual.
      operationId: removerAviso
      security:
        - bearerAuth: [sindico]
      responses:
        "204":
          description: Aviso removido
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  # ---------------------------------------------------------------- Reservas
  /areas-comuns:
    get:
      tags: [Reservas]
      summary: Listar as áreas comuns do condomínio ativo
      operationId: listarAreasComuns
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Lista de áreas comuns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AreaComum" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /areas-comuns/{areaComumId}/disponibilidade:
    parameters:
      - $ref: "#/components/parameters/AreaComumId"
    get:
      tags: [Reservas]
      summary: Consultar horários disponíveis de uma área comum em uma data
      description: Horários de 1 hora, das 08:00 às 22:00. Indisponível quando há reserva `confirmada` sobreposta.
      operationId: getDisponibilidadeAreaComum
      security:
        - bearerAuth: [morador, proprietario]
      parameters:
        - name: data
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Disponibilidade do dia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disponibilidade" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /reservas:
    get:
      tags: [Reservas]
      summary: Listar reservas (próprias, do dia na guarita, ou do condomínio para o síndico)
      description: Morador/proprietário veem as da própria unidade; portaria vê as do dia (`data` padrão = hoje); síndico vê todas.
      operationId: listarReservas
      security:
        - bearerAuth: [morador, proprietario, portaria, sindico]
      parameters:
        - name: data
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservaPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
    post:
      tags: [Reservas]
      summary: Criar uma reserva de área comum
      description: Nasce `confirmada`, com `valor` = taxa da área; unidade e solicitante vêm do token. O solicitante é notificado.
      operationId: criarReserva
      security:
        - bearerAuth: [morador, proprietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservaCreateRequest" }
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Horário indisponível (sobreposição com outra reserva confirmada)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /reservas/{reservaId}:
    parameters:
      - $ref: "#/components/parameters/ReservaId"
    get:
      tags: [Reservas]
      summary: Detalhar uma reserva
      operationId: getReserva
      security:
        - bearerAuth: [morador, proprietario, portaria, sindico]
      responses:
        "200":
          description: Detalhe da reserva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
    delete:
      tags: [Reservas]
      summary: Cancelar uma reserva
      description: A reserva não é apagada; o status passa a `cancelada`.
      operationId: cancelarReserva
      security:
        - bearerAuth: [morador, proprietario]
      responses:
        "204":
          description: Reserva cancelada
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: A reserva não está mais `confirmada`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /reservas/{reservaId}/vistoria:
    parameters:
      - $ref: "#/components/parameters/ReservaId"
    post:
      tags: [Reservas]
      summary: Registrar vistoria de entrada ou saída do espaço reservado
      description: Com `dano = true` gera uma ocorrência `aberta`. Vistoria de `saida` conclui a reserva.
      operationId: registrarVistoriaReserva
      security:
        - bearerAuth: [portaria]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VistoriaRequest" }
      responses:
        "200":
          description: Vistoria registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reserva" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  # ---------------------------------------------------------------- Minha Unidade
  /unidades/minha:
    get:
      tags: [Minha Unidade]
      summary: Consultar os dados da unidade do contexto ativo
      operationId: getMinhaUnidade
      security:
        - bearerAuth: [morador, proprietario]
      responses:
        "200":
          description: Dados da unidade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unidade" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /unidades/minha/vinculos:
    get:
      tags: [Minha Unidade]
      summary: Listar os vínculos (moradores e dependentes) da unidade ativa
      operationId: listarVinculosMinhaUnidade
      security:
        - bearerAuth: [morador, proprietario]
      responses:
        "200":
          description: Lista de vínculos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VinculoUnidade" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /unidades/minha/vinculos/solicitacoes:
    post:
      tags: [Minha Unidade]
      summary: Solicitar a inclusão de um novo vínculo (ex. dependente) à unidade
      operationId: solicitarVinculo
      security:
        - bearerAuth: [morador, proprietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolicitacaoVinculoCreateRequest" }
      responses:
        "202":
          description: Solicitação enviada para aprovação do síndico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitacaoVinculo" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /unidades/minha/inquilinos:
    post:
      tags: [Minha Unidade]
      summary: Cadastrar um inquilino e vincular o contrato de locação à unidade
      description: Cria a pessoa, o vínculo `inquilino` e o perfil `morador`; o convite de acesso é enviado por e-mail (simulado).
      operationId: cadastrarInquilino
      security:
        - bearerAuth: [proprietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquilinoCreateRequest" }
      responses:
        "201":
          description: Inquilino cadastrado e convite de acesso enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VinculoUnidade" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /unidades/minha/inquilinos/{vinculoId}:
    parameters:
      - $ref: "#/components/parameters/VinculoId"
    delete:
      tags: [Minha Unidade]
      summary: Encerrar antecipadamente o contrato de um inquilino
      description: Define `fim` = hoje no vínculo, remove o perfil do inquilino e encerra as sessões dele.
      operationId: encerrarInquilino
      security:
        - bearerAuth: [proprietario]
      responses:
        "204":
          description: Vínculo encerrado e acesso do inquilino revogado
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /unidades/{unidadeId}:
    parameters:
      - $ref: "#/components/parameters/UnidadeId"
    get:
      tags: [Minha Unidade]
      summary: Consultar os dados de qualquer unidade do condomínio (uso administrativo)
      operationId: getUnidade
      security:
        - bearerAuth: [sindico]
      responses:
        "200":
          description: Dados da unidade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unidade" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /unidades/{unidadeId}/vinculos/solicitacoes:
    parameters:
      - $ref: "#/components/parameters/UnidadeId"
    get:
      tags: [Minha Unidade]
      summary: Listar solicitações de vínculo pendentes da unidade
      operationId: listarSolicitacoesVinculo
      security:
        - bearerAuth: [sindico]
      responses:
        "200":
          description: Lista de solicitações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SolicitacaoVinculo" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /unidades/{unidadeId}/vinculos/solicitacoes/{solicitacaoId}:
    parameters:
      - $ref: "#/components/parameters/UnidadeId"
      - $ref: "#/components/parameters/SolicitacaoId"
    patch:
      tags: [Minha Unidade]
      summary: Aprovar ou rejeitar uma solicitação de vínculo
      description: Ao aprovar, cria a pessoa e o vínculo com início hoje.
      operationId: decidirSolicitacaoVinculo
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisaoSolicitacaoVinculoRequest" }
      responses:
        "200":
          description: Solicitação decidida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitacaoVinculo" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Solicitação já decidida
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------- Encomendas
  /encomendas:
    get:
      tags: [Encomendas]
      summary: Listar encomendas (da unidade ativa, ou do condomínio para portaria/síndico)
      operationId: listarEncomendas
      security:
        - bearerAuth: [morador, proprietario, portaria, sindico]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StatusEncomenda" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de encomendas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncomendaPage" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
    post:
      tags: [Encomendas]
      summary: Registrar o recebimento de uma encomenda na portaria
      description: Nasce `aguardando_retirada`, com código de retirada de 6 dígitos; os moradores da unidade são notificados.
      operationId: registrarEncomenda
      security:
        - bearerAuth: [portaria]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncomendaCreateRequest" }
      responses:
        "201":
          description: Encomenda registrada e morador notificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encomenda" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /encomendas/{encomendaId}:
    parameters:
      - $ref: "#/components/parameters/EncomendaId"
    get:
      tags: [Encomendas]
      summary: Detalhar uma encomenda
      operationId: getEncomenda
      security:
        - bearerAuth: [morador, proprietario, portaria, sindico]
      responses:
        "200":
          description: Detalhe da encomenda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encomenda" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /encomendas/{encomendaId}/autorizacoes-retirada:
    parameters:
      - $ref: "#/components/parameters/EncomendaId"
    post:
      tags: [Encomendas]
      summary: Autorizar um terceiro a retirar a encomenda
      description: Gera um código de 6 dígitos válido por `validadeHoras` (padrão 24).
      operationId: autorizarRetiradaTerceiro
      security:
        - bearerAuth: [morador, proprietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutorizacaoRetiradaCreateRequest" }
      responses:
        "201":
          description: Autorização temporária criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutorizacaoRetirada" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  /encomendas/{encomendaId}/retirada:
    parameters:
      - $ref: "#/components/parameters/EncomendaId"
    post:
      tags: [Encomendas]
      summary: Confirmar a retirada da encomenda na portaria
      description: Aceita o código de retirada da encomenda ou o de uma autorização de terceiro `ativa` e dentro da validade (que passa a `utilizada`).
      operationId: confirmarRetiradaEncomenda
      security:
        - bearerAuth: [portaria]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetiradaConfirmRequest" }
      responses:
        "200":
          description: Encomenda marcada como retirada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encomenda" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Código de retirada inválido ou expirado, ou encomenda já retirada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /encomendas/{encomendaId}/ocorrencias:
    parameters:
      - $ref: "#/components/parameters/EncomendaId"
    post:
      tags: [Encomendas]
      summary: Abrir uma ocorrência de extravio vinculada à encomenda
      description: Cria a ocorrência `aberta` e marca a encomenda como `extraviada`.
      operationId: abrirOcorrenciaEncomenda
      security:
        - bearerAuth: [morador, proprietario]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OcorrenciaCreateRequest" }
      responses:
        "201":
          description: Ocorrência aberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ocorrencia" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  # ---------------------------------------------------------------- Notificações
  /notificacoes:
    get:
      tags: [Notificações]
      summary: Listar notificações da pessoa autenticada
      operationId: listarNotificacoes
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Lista de notificações (somente a página pedida, sem metadados)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notificacao" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /notificacoes/{notificacaoId}/lida:
    parameters:
      - $ref: "#/components/parameters/NotificacaoId"
    patch:
      tags: [Notificações]
      summary: Marcar uma notificação como lida
      description: Notificação de outra pessoa → `404`.
      operationId: marcarNotificacaoLida
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Notificação atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notificacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }

  # ---------------------------------------------------------------- Personalização
  /condominio/personalizacao:
    get:
      tags: [Personalização]
      summary: Obter a identidade visual do condomínio ativo
      description: Usado pelo app logo após o login para aplicar nome, logo e cores.
      operationId: getPersonalizacao
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Personalização do condomínio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personalizacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
    patch:
      tags: [Personalização]
      summary: Alterar nome de exibição, logo e cores do condomínio
      description: Somente os campos enviados são alterados. Cores no formato `#RRGGBB`.
      operationId: atualizarPersonalizacao
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalizacaoUpdateRequest" }
            examples:
              cores:
                value: { corPrimaria: "#0F766E", corDestaque: "#F97316" }
      responses:
        "200":
          description: Personalização atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Personalizacao" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

  /condominio/modulos:
    get:
      tags: [Personalização]
      summary: Listar os módulos ativáveis e se estão ativos no condomínio
      description: Usado pelo app para esconder do menu os módulos desativados.
      operationId: listarModulos
      security:
        - bearerAuth: [morador, proprietario, sindico, portaria]
      responses:
        "200":
          description: Situação de cada módulo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuloCondominio" }
              examples:
                seed:
                  value:
                    - { modulo: financeiro, nome: Financeiro, ativo: true, atualizadoEm: "2026-10-01T12:00:00Z" }
                    - { modulo: encomendas, nome: Encomendas, ativo: false, atualizadoEm: "2026-10-05T09:30:00Z" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }

  /condominio/modulos/{modulo}:
    parameters:
      - $ref: "#/components/parameters/Modulo"
    patch:
      tags: [Personalização]
      summary: Ativar ou desativar um módulo no condomínio
      operationId: atualizarModulo
      security:
        - bearerAuth: [sindico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModuloUpdateRequest" }
            examples:
              desativar:
                value: { ativo: false }
      responses:
        "200":
          description: Módulo atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuloCondominio" }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Proibido" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT (HS256) emitido por `POST /auth/login`, `/auth/contexto` ou
        `/auth/refresh`, enviado em `Authorization: Bearer <token>`. Validade de 1 hora.
        Os valores listados em cada operação são os perfis aceitos.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Assinatura HMAC-SHA256 (hex) do corpo da requisição, calculada com o segredo compartilhado do gateway.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StatusCobranca:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/StatusCobranca" }
    Competencia:
      name: competencia
      in: query
      description: Competência no formato AAAA-MM
      schema: { type: string, pattern: '^\d{4}-\d{2}$', example: "2026-09" }
    CobrancaId:
      name: cobrancaId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TaxaId:
      name: taxaId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AutorizacaoId:
      name: autorizacaoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AvisoId:
      name: avisoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AreaComumId:
      name: areaComumId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ReservaId:
      name: reservaId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UnidadeId:
      name: unidadeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SolicitacaoId:
      name: solicitacaoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    VinculoId:
      name: vinculoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EncomendaId:
      name: encomendaId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NotificacaoId:
      name: notificacaoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Modulo:
      name: modulo
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ModuloCodigo" }

  responses:
    RequisicaoInvalida:
      description: Payload ou parâmetro inválido (lista `erros` com os campos)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NaoAutenticado:
      description: Token ausente, expirado, inválido ou de sessão encerrada
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Proibido:
      description: Perfil sem permissão, recurso de outra unidade ou módulo desativado no condomínio
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NaoEncontrado:
      description: Recurso não encontrado (ou de outro condomínio)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ------------------------------------------------ Comuns
    Problem:
      type: object
      description: Formato de erro padrão (RFC 9457)
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        erros:
          type: array
          items: { $ref: "#/components/schemas/ErroCampo" }

    ErroCampo:
      type: object
      properties:
        campo: { type: string }
        mensagem: { type: string }

    PageMetadata:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    PessoaResumo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        telefone: { type: string }

    # ------------------------------------------------ Login
    Perfil:
      type: string
      enum: [morador, proprietario, sindico, portaria]

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Validade do access token em segundos, example: 3600 }
        contexto: { $ref: "#/components/schemas/ContextoAtivo" }
        perfisDisponiveis:
          type: array
          items: { $ref: "#/components/schemas/PerfilDisponivel" }

    ContextoRequest:
      type: object
      required: [condominioId, perfil]
      properties:
        condominioId: { type: integer, format: int64 }
        perfil: { $ref: "#/components/schemas/Perfil" }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    ContextoAtivoResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
        contexto: { $ref: "#/components/schemas/ContextoAtivo" }

    PessoaAutenticada:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        cpf: { type: string }
        email: { type: string, format: email }

    MeResponse:
      type: object
      properties:
        pessoa: { $ref: "#/components/schemas/PessoaAutenticada" }
        perfisDisponiveis:
          type: array
          items: { $ref: "#/components/schemas/PerfilDisponivel" }
        contextoAtivo: { $ref: "#/components/schemas/ContextoAtivo" }

    PerfilDisponivel:
      type: object
      properties:
        perfil: { $ref: "#/components/schemas/Perfil" }
        condominioId: { type: integer, format: int64 }
        condominioNome: { type: string }
        unidadeId: { type: integer, format: int64 }

    ContextoAtivo:
      type: object
      properties:
        perfil: { $ref: "#/components/schemas/Perfil" }
        condominioId: { type: integer, format: int64 }
        condominioNome: { type: string }
        unidadeId: { type: integer, format: int64 }

    # ------------------------------------------------ Minha Unidade
    Unidade:
      type: object
      properties:
        id: { type: integer, format: int64 }
        blocoId: { type: integer, format: int64 }
        blocoNome: { type: string }
        identificacao: { type: string, example: "Apto 302" }
        tipo: { type: string, example: apartamento }
        areaM2: { type: number }
        fracaoIdeal: { type: number }
        status: { type: string, example: ocupada }

    TipoVinculo:
      type: string
      enum: [proprietario, inquilino, dependente]

    VinculoUnidade:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unidadeId: { type: integer, format: int64 }
        pessoa: { $ref: "#/components/schemas/PessoaResumo" }
        tipoVinculo: { $ref: "#/components/schemas/TipoVinculo" }
        principal: { type: boolean }
        inicio: { type: string, format: date }
        fim: { type: string, format: date }

    SolicitacaoVinculoCreateRequest:
      type: object
      required: [tipoVinculo, nome]
      properties:
        tipoVinculo: { $ref: "#/components/schemas/TipoVinculo" }
        nome: { type: string }
        cpf: { type: string }
        observacao: { type: string }

    StatusSolicitacaoVinculo:
      type: string
      enum: [pendente, aprovada, rejeitada]

    SolicitacaoVinculo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unidadeId: { type: integer, format: int64 }
        tipoVinculo: { $ref: "#/components/schemas/TipoVinculo" }
        nomeSolicitado: { type: string }
        status: { $ref: "#/components/schemas/StatusSolicitacaoVinculo" }
        solicitadoEm: { type: string, format: date-time }

    DecisaoSolicitacaoVinculo:
      type: string
      enum: [aprovada, rejeitada]

    DecisaoSolicitacaoVinculoRequest:
      type: object
      required: [decisao]
      properties:
        decisao: { $ref: "#/components/schemas/DecisaoSolicitacaoVinculo" }
        justificativa: { type: string }

    InquilinoCreateRequest:
      type: object
      required: [nome, cpf, contratoInicio]
      properties:
        nome: { type: string }
        cpf: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        contratoInicio: { type: string, format: date }
        contratoFim: { type: string, format: date }

    # ------------------------------------------------ Financeiro
    StatusCobranca:
      type: string
      enum: [pendente, pago, atrasado, cancelado]

    Cobranca:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unidadeId: { type: integer, format: int64 }
        taxaDescricao: { type: string }
        competencia: { type: string, example: "2026-09" }
        vencimento: { type: string, format: date }
        valorOriginal: { type: number }
        multa: { type: number }
        juros: { type: number }
        valorTotal: { type: number }
        status: { $ref: "#/components/schemas/StatusCobranca" }

    CobrancaPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Cobranca" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    PixResponse:
      type: object
      properties:
        codigoPix: { type: string }
        expiraEm: { type: string, format: date-time }

    BaixaManualRequest:
      type: object
      required: [meio, valor, pagoEm]
      properties:
        meio: { type: string, example: transferencia }
        valor: { type: number }
        pagoEm: { type: string, format: date-time }
        observacao: { type: string }

    StatusPagamentoWebhook:
      type: string
      enum: [confirmado, falhou]

    PagamentoWebhookPayload:
      type: object
      required: [transacaoId, cobrancaId, status]
      properties:
        transacaoId: { type: string }
        cobrancaId: { type: integer, format: int64 }
        valor: { type: number }
        status: { $ref: "#/components/schemas/StatusPagamentoWebhook" }
        pagoEm: { type: string, format: date-time }

    DocumentoFinanceiro:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tipo: { type: string, example: nota_fiscal }
        titulo: { type: string }
        arquivoUrl: { type: string, format: uri }
        competencia: { type: string, format: date }
        publicadoEm: { type: string, format: date-time }

    DocumentoFinanceiroPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DocumentoFinanceiro" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    DocumentoFinanceiroCreateRequest:
      type: object
      required: [tipo, titulo, arquivoUrl]
      properties:
        tipo: { type: string, example: nota_fiscal }
        titulo: { type: string }
        arquivoUrl: { type: string, format: uri }
        competencia: { type: string, format: date }

    TipoRateio:
      type: string
      enum: [igualitario, fracao_ideal]

    TaxaCreateRequest:
      type: object
      required: [descricao, competencia, valor, tipoRateio, vencimentoDia]
      properties:
        descricao: { type: string }
        competencia: { type: string, pattern: '^\d{4}-\d{2}$', example: "2026-09" }
        valor: { type: number }
        tipoRateio: { $ref: "#/components/schemas/TipoRateio" }
        vencimentoDia: { type: integer, minimum: 1, maximum: 28 }

    Taxa:
      type: object
      properties:
        id: { type: integer, format: int64 }
        descricao: { type: string }
        competencia: { type: string, example: "2026-09" }
        valor: { type: number }
        tipoRateio: { $ref: "#/components/schemas/TipoRateio" }
        vencimentoDia: { type: integer }

    FalhaGeracaoCobranca:
      type: object
      properties:
        unidadeId: { type: integer, format: int64 }
        motivo: { type: string }

    GerarCobrancasResponse:
      type: object
      properties:
        taxaId: { type: integer, format: int64 }
        totalGeradas: { type: integer }
        falhas:
          type: array
          items: { $ref: "#/components/schemas/FalhaGeracaoCobranca" }

    InadimplenciaResumo:
      type: object
      properties:
        totalUnidades: { type: integer }
        unidadesInadimplentes: { type: integer }
        percentualInadimplencia: { type: number }
        valorTotalEmAberto: { type: number }

    # ------------------------------------------------ Reservas
    AreaComum:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        descricao: { type: string }
        capacidade: { type: integer }
        taxa: { type: number }
        requerReserva: { type: boolean }
        status: { type: string, example: disponivel }

    HorarioDisponivel:
      type: object
      properties:
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        disponivel: { type: boolean }

    Disponibilidade:
      type: object
      properties:
        data: { type: string, format: date }
        horarios:
          type: array
          items: { $ref: "#/components/schemas/HorarioDisponivel" }

    ReservaCreateRequest:
      type: object
      required: [areaComumId, inicio, fim]
      properties:
        areaComumId: { type: integer, format: int64 }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }

    StatusReserva:
      type: string
      enum: [confirmada, cancelada, concluida, nao_compareceu]

    Reserva:
      type: object
      properties:
        id: { type: integer, format: int64 }
        areaComumId: { type: integer, format: int64 }
        areaComumNome: { type: string }
        unidadeId: { type: integer, format: int64 }
        solicitante: { $ref: "#/components/schemas/PessoaResumo" }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/StatusReserva" }
        valor: { type: number }

    ReservaPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Reserva" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    MomentoVistoria:
      type: string
      enum: [entrada, saida]

    VistoriaRequest:
      type: object
      required: [momento]
      properties:
        momento: { $ref: "#/components/schemas/MomentoVistoria" }
        observacao: { type: string }
        dano: { type: boolean, default: false }
        fotosUrl:
          type: array
          items: { type: string, format: uri }

    # ------------------------------------------------ Portaria
    VisitanteInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string }
        documento: { type: string }
        telefone: { type: string }

    Visitante:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nome: { type: string }
        documento: { type: string }
        telefone: { type: string }
        observacao: { type: string }

    StatusAutorizacaoVisita:
      type: string
      enum: [pendente, autorizada, recusada, expirada]

    AutorizacaoVisitaCreateRequest:
      type: object
      required: [unidadeId, visitante, motivo]
      properties:
        unidadeId: { type: integer, format: int64 }
        visitante: { $ref: "#/components/schemas/VisitanteInput" }
        motivo: { type: string }
        fotoUrl: { type: string, format: uri }

    AutorizacaoVisita:
      type: object
      properties:
        id: { type: integer, format: int64 }
        visitante: { $ref: "#/components/schemas/Visitante" }
        unidadeId: { type: integer, format: int64 }
        motivo: { type: string }
        solicitadoEm: { type: string, format: date-time }
        respondidoEm: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/StatusAutorizacaoVisita" }

    AutorizacaoVisitaPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/AutorizacaoVisita" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    DecisaoAutorizacao:
      type: string
      enum: [autorizado, recusado]

    DecisaoAutorizacaoRequest:
      type: object
      required: [decisao]
      properties:
        decisao: { $ref: "#/components/schemas/DecisaoAutorizacao" }
        justificativa: { type: string }

    TipoAcesso:
      type: string
      enum: [entrada, saida]

    StatusAcesso:
      type: string
      enum: [no_condominio, saiu]

    AcessoCreateRequest:
      type: object
      required: [visitanteId, tipo]
      properties:
        autorizacaoId: { type: integer, format: int64 }
        visitanteId: { type: integer, format: int64 }
        tipo: { $ref: "#/components/schemas/TipoAcesso" }
        fotoUrl: { type: string, format: uri }

    Acesso:
      type: object
      properties:
        id: { type: integer, format: int64 }
        autorizacaoId: { type: integer, format: int64 }
        visitante: { $ref: "#/components/schemas/Visitante" }
        entrada: { type: string, format: date-time }
        saida: { type: string, format: date-time }
        tipo: { $ref: "#/components/schemas/TipoAcesso" }
        status: { $ref: "#/components/schemas/StatusAcesso" }

    AcessoPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Acesso" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    # ------------------------------------------------ Avisos
    PrioridadeAviso:
      type: string
      enum: [normal, urgente]

    TipoPublicoAlvo:
      type: string
      enum: [condominio, bloco, unidade]

    PublicoAlvo:
      type: object
      required: [tipo]
      properties:
        tipo: { $ref: "#/components/schemas/TipoPublicoAlvo" }
        blocoId: { type: integer, format: int64 }
        unidadeId: { type: integer, format: int64 }

    AvisoCreateRequest:
      type: object
      required: [titulo, conteudo, publicoAlvo]
      properties:
        titulo: { type: string }
        conteudo: { type: string }
        categoria: { type: string, example: manutencao }
        prioridade: { $ref: "#/components/schemas/PrioridadeAviso" }
        publicoAlvo: { $ref: "#/components/schemas/PublicoAlvo" }
        expiraEm: { type: string, format: date-time }

    AvisoUpdateRequest:
      type: object
      properties:
        titulo: { type: string }
        conteudo: { type: string }
        categoria: { type: string }
        prioridade: { $ref: "#/components/schemas/PrioridadeAviso" }
        expiraEm: { type: string, format: date-time }

    Aviso:
      type: object
      properties:
        id: { type: integer, format: int64 }
        titulo: { type: string }
        conteudo: { type: string }
        categoria: { type: string }
        prioridade: { $ref: "#/components/schemas/PrioridadeAviso" }
        publicoAlvo: { $ref: "#/components/schemas/PublicoAlvo" }
        autor: { $ref: "#/components/schemas/PessoaResumo" }
        publicadoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
        lidoPeloUsuario: { type: boolean }

    AvisoPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Aviso" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    # ------------------------------------------------ Encomendas
    StatusEncomenda:
      type: string
      enum: [aguardando_retirada, retirada, extraviada]

    EncomendaCreateRequest:
      type: object
      required: [unidadeId, transportadora]
      properties:
        unidadeId: { type: integer, format: int64 }
        remetente: { type: string }
        transportadora: { type: string }
        codigoRastreio: { type: string }
        fotoUrl: { type: string, format: uri }

    Encomenda:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unidadeId: { type: integer, format: int64 }
        remetente: { type: string }
        transportadora: { type: string }
        codigoRastreio: { type: string }
        codigoRetirada: { type: string }
        fotoUrl: { type: string, format: uri }
        recebidaEm: { type: string, format: date-time }
        retiradaEm: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/StatusEncomenda" }

    EncomendaPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Encomenda" }
        page: { $ref: "#/components/schemas/PageMetadata" }

    AutorizacaoRetiradaCreateRequest:
      type: object
      required: [nomeTerceiro, documento]
      properties:
        nomeTerceiro: { type: string }
        documento: { type: string }
        validadeHoras: { type: integer, minimum: 1, default: 24 }

    StatusAutorizacaoRetirada:
      type: string
      enum: [ativa, utilizada, expirada]

    AutorizacaoRetirada:
      type: object
      properties:
        id: { type: integer, format: int64 }
        encomendaId: { type: integer, format: int64 }
        nomeTerceiro: { type: string }
        documento: { type: string }
        codigo: { type: string }
        validade: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/StatusAutorizacaoRetirada" }

    RetiradaConfirmRequest:
      type: object
      required: [codigo]
      properties:
        codigo: { type: string }
        retiradoPorNome: { type: string }
        retiradoPorDocumento: { type: string }

    OcorrenciaCreateRequest:
      type: object
      required: [titulo, descricao]
      properties:
        titulo: { type: string }
        descricao: { type: string }

    StatusOcorrencia:
      type: string
      enum: [aberta, em_andamento, encerrada]

    Ocorrencia:
      type: object
      properties:
        id: { type: integer, format: int64 }
        titulo: { type: string }
        descricao: { type: string }
        status: { $ref: "#/components/schemas/StatusOcorrencia" }
        abertaEm: { type: string, format: date-time }
        encerradaEm: { type: string, format: date-time }

    # ------------------------------------------------ Notificações
    TipoNotificacao:
      type: string
      enum: [portaria, encomenda, financeiro, aviso, reserva]

    Notificacao:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tipo: { $ref: "#/components/schemas/TipoNotificacao" }
        titulo: { type: string }
        mensagem: { type: string }
        referenciaId: { type: integer, format: int64 }
        enviadaEm: { type: string, format: date-time }
        lidaEm: { type: string, format: date-time }

    # ------------------------------------------------ Personalização
    Personalizacao:
      type: object
      properties:
        condominioId: { type: integer, format: int64 }
        nomeExibicao: { type: string, example: "Condomínio Demo" }
        logoUrl: { type: [string, "null"], format: uri }
        corPrimaria: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: "#1F4E79" }
        corSecundaria: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: "#F2F4F7" }
        corDestaque: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: "#F59E0B" }
        atualizadoEm: { type: string, format: date-time }

    PersonalizacaoUpdateRequest:
      type: object
      description: Todos os campos opcionais; envie só o que quer alterar. `logoUrl` nulo remove a logo.
      properties:
        nomeExibicao: { type: string, minLength: 1, maxLength: 60 }
        logoUrl: { type: [string, "null"], format: uri }
        corPrimaria: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        corSecundaria: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        corDestaque: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }

    ModuloCodigo:
      type: string
      description: Módulos que o síndico pode ativar/desativar.
      enum: [financeiro, portaria, avisos, reservas, minha_unidade, encomendas]

    ModuloCondominio:
      type: object
      properties:
        modulo: { $ref: "#/components/schemas/ModuloCodigo" }
        nome: { type: string, example: Encomendas }
        ativo: { type: boolean }
        atualizadoEm: { type: string, format: date-time }

    ModuloUpdateRequest:
      type: object
      required: [ativo]
      properties:
        ativo: { type: boolean }

    # ------------------------------------------------ Tela Inicial
    DashboardMorador:
      type: object
      properties:
        perfil: { type: string, enum: [morador, proprietario] }
        unidade: { $ref: "#/components/schemas/Unidade" }
        proximosBoletos:
          type: array
          items: { $ref: "#/components/schemas/Cobranca" }
        avisosRecentes:
          type: array
          items: { $ref: "#/components/schemas/Aviso" }
        encomendasPendentes:
          type: array
          items: { $ref: "#/components/schemas/Encomenda" }
        autorizacoesPendentes:
          type: array
          items: { $ref: "#/components/schemas/AutorizacaoVisita" }
        proximasReservas:
          type: array
          items: { $ref: "#/components/schemas/Reserva" }

    DashboardSindico:
      type: object
      properties:
        perfil: { type: string, enum: [sindico] }
        inadimplencia: { $ref: "#/components/schemas/InadimplenciaResumo" }
        avisosPublicadosRecentes:
          type: array
          items: { $ref: "#/components/schemas/Aviso" }
        solicitacoesVinculoPendentes: { type: integer }
        ocorrenciasAbertas: { type: integer }

    DashboardPortaria:
      type: object
      properties:
        perfil: { type: string, enum: [portaria] }
        autorizacoesPendentes:
          type: array
          items: { $ref: "#/components/schemas/AutorizacaoVisita" }
        reservasDoDia:
          type: array
          items: { $ref: "#/components/schemas/Reserva" }
        encomendasRecebidasHoje: { type: integer }
